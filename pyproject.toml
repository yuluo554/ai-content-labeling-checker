[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-labeling-checker"
version = "0.2.0"
description = "AI 生成合成内容标识合规核查器：以《标识办法》+ 强制国标 GB 45438-2025 为规则源，做显式/隐式标识核验、批量扫描与合规证据链（全本地、零上传）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = [
    "ai-generated-content",
    "content-labeling",
    "compliance",
    "gb45438",
    "metadata-verification",
    "chinese-regulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# 核心层零第三方依赖（架构纪律，见 plan/03）：全部重件走 extras。
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]
report = ["openpyxl"]
# 重依赖一律写**上限**（只写下限等于没 pin，见 plan/03 §五）。
# 2026-10-19（D-1/D-2）：Python 下限抬到 3.12 后，3.8 的 marker 分支全部删除；
# PySide6 6.12.0 已实测 438 passed（旧上限 <6.8 无实测理由）。
gui = ["PySide6>=6.12,<7"]
# PyInstaller 6.22.3 已实测构建 + verify_dist 双 exe 通过（spec 的 PYZ(analysis.pure)
# 写法在 6.x 仍适用）。
pkg = ["pyinstaller>=6.22,<7"]

[project.scripts]
labelcheck = "labelcheck.cli.main:main"

[project.urls]
Homepage = "https://github.com/yuluo554/ai-content-labeling-checker"
Source = "https://github.com/yuluo554/ai-content-labeling-checker"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:labelcheck.*"]
