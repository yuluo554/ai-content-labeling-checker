name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 旧解释器（3.8）只在 windows 守：ubuntu 新镜像对 py3.8 支持存疑，
        # 不硬凑四矩阵（见 plan/06 D16）。
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      # 必须取全量历史：历史/元数据类守门测试依赖 git log，
      # 默认 fetch-depth: 1 浅克隆会让它们静默削弱成空验。
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment
        shell: bash
        run: |
          python --version
          python -m pip --version
          python -c "import platform; print(platform.platform())"

      - name: Verify workflow is what we think it is
        shell: bash
        run: |
          python -c "import labelcheck, sys; print('labelcheck', labelcheck.__version__, 'on', sys.version)"

      - name: Self-check (data location + ruleset gate)
        shell: bash
        run: |
          labelcheck selfcheck

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -ra

  # CLI 可脚本化通路：无 GUI 依赖也能完整跑（AST 守门已在测试中断言）
  cli-smoke:
    name: cli smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only, no extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: CLI version
        shell: bash
        run: |
          labelcheck version

      - name: CLI selfcheck (json)
        shell: bash
        run: |
          labelcheck selfcheck --json

      - name: CLI check on shipped sample card
        shell: bash
        run: |
          labelcheck check data/samples/card-text-basic.json
          echo "exit=$?"
